# This starter workflow is for a CMake project running on multiple platforms.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
#
# NOTE: macOS / Clang / MSVC (`cl`) are intentionally not part of the matrix
# because none of them implement C++26 reflection, which Skirnir (and thus
# Freya) requires. Windows builds use the MinGW-w64 GCC 16 toolchain from
# niXman/mingw-builds-binaries.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "include/**"
      - "Examples/**"
      - "Shaders/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/cmake-multi-platform.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "include/**"
      - "Examples/**"
      - "Shaders/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/cmake-multi-platform.yml"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: windows-latest
            c_compiler: 'C:/mingw64-gcc16/bin/gcc.exe'
            cpp_compiler: 'C:/mingw64-gcc16/bin/g++.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Add ubuntu-toolchain-r PPA on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update

      - name: Cache and install gcc-16 on Linux
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: gcc-16 g++-16
          version: gcc16-1.0

      - name: Switch default gcc/g++ to 16 on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16
          sudo update-alternatives --set gcc /usr/bin/gcc-16
          gcc --version
          g++ --version

      - name: Install SDL3 build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev \
            libpulse-dev libasound2-dev \
            ninja-build glslang-tools

      - name: Cache MinGW-w64 GCC 16 on Windows
        if: matrix.os == 'windows-latest'
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: C:\mingw64-gcc16
          key: mingw64-gcc16-16.1.0-rt_v14-rev1-posix-seh-ucrt

      - name: Install MinGW-w64 GCC 16 (niXman mingw-builds) on Windows
        if: matrix.os == 'windows-latest' && steps.cache-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/16.1.0-rt_v14-rev1/x86_64-16.1.0-release-posix-seh-ucrt-rt_v14-rev1.7z'
          $zip = "$env:TEMP\mingw64.7z"
          $scratch = 'C:\mingw64-scratch'
          $toolchain = 'C:\mingw64-gcc16'
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Write-Host "Extracting toolchain to $scratch"
          if (Test-Path $scratch) { Remove-Item -Recurse -Force $scratch }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          & 7z.exe x $zip "-o${scratch}\" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE" }
          $extracted = Get-ChildItem -Path $scratch -Directory |
            Select-Object -First 1
          if (-not $extracted) { throw "No directory found under $scratch after 7z extraction" }
          if (Test-Path $toolchain) { Remove-Item -Recurse -Force $toolchain }
          Rename-Item -Path $extracted.FullName -NewName 'mingw64-gcc16'
          Move-Item -Path (Join-Path $scratch 'mingw64-gcc16') -Destination $toolchain -Force
          Remove-Item -Recurse -Force $scratch
          $gcc = Join-Path $toolchain 'bin\gcc.exe'
          if (-not (Test-Path $gcc)) { throw "gcc.exe not found at $gcc" }
          & $gcc --version

      - name: Prepend MinGW GCC 16 to PATH on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = 'C:\mingw64-gcc16'
          $gcc = Join-Path $toolchain 'bin\gcc.exe'
          if (-not (Test-Path $gcc)) { throw "gcc.exe not found at $gcc" }
          $sysPath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $newSysPath = ($sysPath -split ';' | Where-Object { $_ -and ($_ -notmatch 'mingw64') -and ($_ -notmatch 'msys64') }) -join ';'
          $newSysPath = "$toolchain\bin;$newSysPath"
          [Environment]::SetEnvironmentVariable('Path', $newSysPath, 'Machine')
          $env:Path = $newSysPath
          & $gcc --version
          & (Join-Path $toolchain 'bin\g++.exe') --version

      - name: Install Ninja on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install ninja -y

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.328.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure CMake
        shell: bash
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSDL_X11_XTEST=OFF
          -S ${{ github.workspace }}

      - name: Build
        shell: bash
        run: |
          export PATH="/c/mingw64-gcc16/bin:$PATH"
          cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

      - name: Test
        shell: bash
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: |
          export PATH="/c/mingw64-gcc16/bin:$PATH"
          ctest --build-config ${{ matrix.build_type }}
